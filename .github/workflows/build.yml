name: C++ Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libglu1-mesa-dev libx11-dev libglfw3-dev libassimp-dev libsdl2-dev espeak-ng ffmpeg

    - name: Configure CMake
      run: cmake -S TheSupermarket -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --target TheSupermarket OffsetDumper
