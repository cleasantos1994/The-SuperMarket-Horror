name: PC Build & Offsets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libassimp-dev libglm-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake ../TheSupermarket -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Extract Offsets
        run: |
          python3 TheSupermarket/tools/extract_offsets.py build/TheSupermarket build/offsets.json

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: the-supermarket-pc-binary
          path: build/TheSupermarket

      - name: Upload Offsets JSON
        uses: actions/upload-artifact@v4
        with:
          name: memory-offsets
          path: build/offsets.json
