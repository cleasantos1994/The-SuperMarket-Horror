name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Install Android SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Build with Gradle
        run: |
          cd TheSupermarket/android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.bundle.abiFilters=arm64-v8a

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-supermarket-debug-apk
          path: TheSupermarket/android/app/build/outputs/apk/debug/app-debug.apk

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ../TheSupermarket -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Extract Offsets
        shell: bash
        run: |
          # Collect all DLLs (SDL2, etc) into the dumper's folder so it can start
          find build -name "*.dll" -exec cp {} build/Release/ \; 2>/dev/null || true
          python TheSupermarket/tools/extract_offsets.py build/Release build/offsets.json

      - name: Package and Send to Discord
        shell: bash
        run: |
          mkdir -p release_windows
          # Use wildcards and ignore errors to ensure we grab everything available
          cp build/Release/*.exe release_windows/ 2>/dev/null || true
          cp build/Release/*.dll release_windows/ 2>/dev/null || true
          cp -r TheSupermarket/assets release_windows/assets
          cp build/offsets.json release_windows/ 2>/dev/null || true
          
          # Create ZIP
          powershell.exe -Command "Compress-Archive -Path release_windows/* -DestinationPath TheSupermarket-Windows.zip -Force"
          
          # Final existence check before curl
          if [ ! -f "TheSupermarket-Windows.zip" ]; then echo "ZIP MISSING"; exit 1; fi
          if [ ! -f "build/offsets.json" ]; then echo "OFFSETS MISSING"; exit 1; fi

          # Send to Discord
          curl -X POST -H "Content-Type: multipart/form-data" \
               -F "payload_json={\"content\": \"**New Windows Build (v${{ github.run_id }})**\nBranch: ${{ github.ref_name }}\"}" \
               -F "file1=@TheSupermarket-Windows.zip" \
               -F "file2=@build/offsets.json" \
               https://discord.com/api/webhooks/1498742681243746374/q6inOKmEMptesJWKxNM20RDb-EaBAYEZGO4UFY4NYZUkk5dGXrhu_nuWohVH_t0Mt3RA

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-supermarket-windows-client
          path: TheSupermarket-Windows.zip

  release:
    needs: [android-build, windows-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_id }}
          name: Release ${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.apk
            TheSupermarket-Windows.zip
            artifacts/**/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
