name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/build-tools/34.0.0
            /usr/local/lib/android/sdk/ndk/25.2.9519653
          key: ${{ runner.os }}-android-sdk-34-ndk-25

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Install Android SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Build with Gradle
        run: |
          cd TheSupermarket/android
          chmod +x gradlew
          # Optimize: Build only arm64-v8a to save time
          ./gradlew assembleDebug -Pandroid.bundle.abiFilters=arm64-v8a

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-supermarket-debug-apk
          path: TheSupermarket/android/app/build/outputs/apk/debug/app-debug.apk

  pc-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libassimp-dev libglm-dev libgl1-mesa-dev libglu1-mesa-dev zip

      - name: Cache CMake FetchContent
        uses: actions/cache@v3
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake ../TheSupermarket -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Extract Offsets
        run: |
          python3 TheSupermarket/tools/extract_offsets.py build build/offsets.json

      - name: Package PC Client
        run: |
          mkdir -p release_pc
          cp build/TheSupermarket release_pc/
          cp build/OffsetDumper release_pc/
          cp build/*.so release_pc/ || true
          cp -r TheSupermarket/assets release_pc/
          cp build/offsets.json release_pc/
          zip -r TheSupermarket-PC.zip release_pc/

      - name: Upload PC Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-supermarket-pc-client
          path: TheSupermarket-PC.zip

      - name: Upload Offsets JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-offsets
          path: build/offsets.json

  release:
    needs: [android-build, pc-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_id }}
          name: Release ${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.apk
            TheSupermarket-PC.zip
            artifacts/**/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
