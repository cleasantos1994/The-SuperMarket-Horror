name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  android-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Install SDK and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg espeak
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Generate Real Assets
        run: |
          python3 TheSupermarket/tools/generate_real_assets.py

      - name: Build with Gradle
        run: |
          cd TheSupermarket/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-supermarket-debug-apk
          path: TheSupermarket/android/app/build/outputs/apk/debug/app-debug.apk

  pc-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libassimp-dev libglm-dev libgl1-mesa-dev libglu1-mesa-dev imagemagick ffmpeg espeak

      - name: Generate Real Assets
        run: |
          python3 TheSupermarket/tools/generate_real_assets.py

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake ../TheSupermarket -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Extract Offsets
        run: |
          python3 TheSupermarket/tools/extract_offsets.py build/TheSupermarket build/internal_offsets.json

      - name: Upload PC Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-supermarket-pc-binary
          path: build/TheSupermarket

      - name: Upload Internal Offsets JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: internal-memory-offsets
          path: build/internal_offsets.json

  release:
    needs: [android-build, pc-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_id }}
          name: Release ${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.apk
            artifacts/**/TheSupermarket
            artifacts/**/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
